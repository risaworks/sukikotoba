<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ハンバーガーやさん</title><style>*{box-sizing:border-box}body{margin:0;background:#f9ecd5;color:#65432c;font-family:system-ui,sans-serif;text-align:center}main{max-width:540px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center}button{font:inherit;border:0;cursor:pointer;touch-action:manipulation;color:inherit}header button{background:#fff9ed;border-radius:16px;padding:10px}h1{font-size:20px}.shop{position:relative;overflow:hidden;border-radius:24px;background:linear-gradient(#f6d7a5 0 13%,#fff4d9 13% 75%,#d39a62 75%);height:260px;border:4px solid white}.awning{height:30px;background:repeating-linear-gradient(90deg,#d85a43 0 45px,#fff4da 45px 90px);border-radius:0 0 12px 12px}.customer{width:155px;height:155px;margin:0 auto;animation:arrive .7s ease-out;transform-origin:bottom}.customer svg{width:100%;height:100%}.talk{animation:bob .35s infinite alternate}.order{display:flex;justify-content:center;gap:5px;min-height:52px;align-items:center;background:#fff9ec;border-radius:16px;margin:8px auto;width:max-content;max-width:95%;padding:4px 12px}.order svg{width:47px;height:47px}.counter{display:flex;gap:8px;margin:12px 0}.food{flex:1;min-width:0;background:#fff9ed;border-radius:20px;box-shadow:0 5px #d9bd91;padding:8px}.food svg{width:100%;height:82px}.tray{width:100%;height:105px;background:#b74c38;border:8px solid #d46b50;border-radius:22px;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px #873c2b}.tray svg{width:76px;height:76px;animation:pop .35s}.hint{animation:glow 1.2s infinite alternate}.money{background:#fff4da;border-radius:20px;padding:10px;margin:12px auto;display:flex;justify-content:center;gap:16px;align-items:center}.money button{background:transparent}.coin{display:grid;place-items:center;width:65px;height:65px;border:5px double #c49b42;background:#f5d77b;border-radius:50%;font-weight:bold;font-size:24px;box-shadow:0 4px #a98135}.register{background:#79928a;border-radius:12px;padding:10px;color:white;width:100px}.drawer{background:#415e58;height:8px;transition:height .4s}.open .drawer{height:35px}.fly{position:fixed;pointer-events:none;z-index:9;transition:transform .55s ease,opacity .55s;width:70px;height:70px}.fly svg{width:100%;height:100%}.hidden{display:none!important}@keyframes arrive{from{transform:translateX(220px)}to{transform:translateX(0)}}@keyframes bob{to{transform:translateY(-4px)}}@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}@keyframes glow{to{box-shadow:0 0 0 5px #ffd05c,0 0 18px #ffc548}}.depart{animation:leave .8s forwards}@keyframes leave{to{transform:translateX(-260px);opacity:0}}#message{min-height:25px;margin:8px;font-weight:bold}#start{position:absolute;inset:30px 0 0;background:#fff4d9e8;display:grid;place-items:center}#start button{background:#7ab55b;border-radius:50%;width:100px;height:100px;color:white;font-size:48px}</style><main><header><button onclick="location.href='./'" aria-label="ホーム">⌂</button><h1>ハンバーガーやさん</h1><button id="sound" aria-label="音">🔊</button></header><div class="shop"><div class="awning"></div><div class="order" id="order"></div><div class="customer" id="customer"></div><div id="start"><button aria-label="はじめる">▶</button></div></div><div id="message"></div><div class="counter" id="foods"></div><button class="tray" id="tray" aria-label="トレー"></button><div class="money hidden" id="money"><button id="coin" aria-label="お金"><span class="coin">100</span></button><div class="register" id="register">レジ<div class="drawer"></div></div><button id="change" class="hidden" aria-label="おつり"><span class="coin">10</span></button></div></main><script>
const $=id=>document.getElementById(id), names=['ハンバーガー','ポテト','ジュース'];const wrap=s=>`<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${s}</svg>`;const art=[wrap('<ellipse cx="50" cy="88" rx="42" ry="7" fill="#e3cbb0"/><path d="M9 70Q50 83 91 70L88 82Q50 96 12 82Z" fill="#e8a54a"/><rect x="8" y="58" width="84" height="17" rx="8" fill="#79412a"/><path d="M10 57L90 57 65 72 42 61Z" fill="#ffce48"/><path d="M9 50Q18 42 28 51T48 51T68 51T91 50L91 59 9 59Z" fill="#68a94c"/><rect x="12" y="44" width="76" height="10" rx="5" fill="#d94f3d"/><path d="M8 45Q9 9 50 9T92 45Z" fill="#e9a23e"/><path d="M17 35Q30 12 54 16" stroke="#ffd083" stroke-width="5" fill="none" stroke-linecap="round"/><g fill="#fff1c5"><ellipse cx="35" cy="24" rx="3" ry="1.5"/><ellipse cx="60" cy="20" rx="3" ry="1.5"/><ellipse cx="74" cy="32" rx="3" ry="1.5"/></g>'),wrap('<g stroke="#e8a92e" stroke-width="2" fill="#ffda68"><rect x="18" y="13" width="12" height="57" rx="3" transform="rotate(-12 24 40)"/><rect x="32" y="5" width="12" height="65" rx="3"/><rect x="46" y="17" width="12" height="55" rx="3"/><rect x="60" y="7" width="12" height="65" rx="3" transform="rotate(8 66 40)"/><rect x="74" y="19" width="12" height="50" rx="3"/></g><path d="M12 43Q50 59 88 43L77 92H23Z" fill="#d94d39"/><path d="M20 51L29 84" stroke="#f37b58" stroke-width="4"/><circle cx="50" cy="72" r="11" fill="#ffe0a0"/>'),wrap('<path d="M60 30L67 6 84 6" stroke="#cf4d3c" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M22 30H78L70 92H30Z" fill="#eaa23e"/><path d="M28 38L35 84" stroke="#ffd67c" stroke-width="5"/><ellipse cx="50" cy="30" rx="31" ry="8" fill="#fff3d7"/><ellipse cx="50" cy="29" rx="24" ry="4" fill="#f4b54c"/><circle cx="50" cy="61" r="13" fill="#fff0c4"/>')];
function animal(n){let colors=[['#a9652e','#f6bf65'],['#45403d','#fff7e9'],['#655047','#a68b75']][n];let extra=n===0?Array.from({length:12},(_,i)=>`<circle cx="${50+35*Math.cos(i*Math.PI/6)}" cy="${48+35*Math.sin(i*Math.PI/6)}" r="15" fill="${colors[0]}"/>`).join(''): `<circle cx="22" cy="20" r="13" fill="${colors[0]}"/><circle cx="78" cy="20" r="13" fill="${colors[0]}"/>`;return wrap(`<ellipse cx="50" cy="94" rx="36" ry="25" fill="${colors[0]}"/>${extra}<ellipse cx="50" cy="48" rx="35" ry="35" fill="${colors[1]}"/>${n===1?'<ellipse cx="35" cy="43" rx="10" ry="13" fill="#45403d"/><ellipse cx="65" cy="43" rx="10" ry="13" fill="#45403d"/>':''}<ellipse cx="50" cy="62" rx="22" ry="17" fill="#fff0d0"/><circle cx="35" cy="43" r="4" fill="#251e19"/><circle cx="65" cy="43" r="4" fill="#251e19"/><ellipse cx="50" cy="55" rx="7" ry="5" fill="#493027"/><ellipse id="mouth" cx="50" cy="67" rx="10" ry="6" fill="#71372c"/><ellipse cx="18" cy="91" rx="12" ry="9" fill="${colors[1]}"/><ellipse cx="82" cy="91" rx="12" ry="9" fill="${colors[1]}"/></svg>`.replace('</svg>',''))}
let wanted=[],picked=[],phase='start',round=0,muted=false,ctx,timer;function beep(f=500){if(muted)return;try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.setValueAtTime(.07,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.18);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.2)}catch(e){}}function say(s){$('message').textContent=s;if(!muted&&window.speechSynthesis){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(s);u.lang='ja-JP';u.rate=.85;speechSynthesis.speak(u)}$('customer').classList.add('talk');setTimeout(()=>$('customer').classList.remove('talk'),1200)}function hints(){document.querySelectorAll('.hint').forEach(e=>e.classList.remove('hint'));clearTimeout(timer);timer=setTimeout(()=>{let el=phase==='pick'?$('f'+wanted.find(i=>!picked.includes(i))):phase==='serve'?$('tray'):phase==='pay'?$('coin'):phase==='change'?$('change'):phase==='eat'?$('customer'):null;el?.classList.add('hint')},3500)}function next(){phase='pick';picked=[];wanted=[0,1,2].sort(()=>Math.random()-.5).slice(0,Math.min(3,1+Math.floor(round/2)));$('customer').className='customer';$('customer').innerHTML=animal(round%3);$('order').innerHTML=wanted.map(i=>art[i]).join('');$('tray').innerHTML='';$('money').classList.add('hidden');$('change').classList.add('hidden');$('coin').classList.remove('hidden');$('register').classList.remove('open');say(wanted.map(i=>names[i]).join('と、')+' ください！');hints()}function fly(from,to,html){let a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),d=document.createElement('div');d.className='fly';d.innerHTML=html;d.style.left=a.left+a.width/2-35+'px';d.style.top=a.top+a.height/2-35+'px';document.body.append(d);requestAnimationFrame(()=>requestAnimationFrame(()=>{d.style.transform=`translate(${b.left+b.width/2-a.left-a.width/2}px,${b.top+b.height/2-a.top-a.height/2}px)`;d.style.opacity='.3'}));setTimeout(()=>d.remove(),600)}$('foods').innerHTML=art.map((a,i)=>`<button class="food" id="f${i}" aria-label="${names[i]}">${a}</button>`).join('');art.forEach((a,i)=>$('f'+i).onclick=()=>{if(phase!=='pick')return;if(!wanted.includes(i)||picked.includes(i)){say(names[i]+' だね');hints();return}picked.push(i);fly($('f'+i),$('tray'),a);beep();$('tray').innerHTML=picked.map(j=>art[j]).join('');if(picked.length===wanted.length){phase='serve';say('ありがとう！');$('tray').classList.add('hint')}else say(names[i]);hints()});$('tray').onclick=()=>{if(phase!=='serve')return;fly($('tray'),$('customer'),$('tray').innerHTML);$('tray').innerHTML='';phase='pay';$('money').classList.remove('hidden');say('おかね どうぞ');beep();hints()};$('coin').onclick=()=>{if(phase!=='pay')return;fly($('coin'),$('register'),'<span class="coin">100</span>');$('coin').classList.add('hidden');$('register').classList.add('open');$('change').classList.remove('hidden');phase='change';beep(900);say('おつり ください');hints()};$('change').onclick=()=>{if(phase!=='change')return;fly($('change'),$('customer'),'<span class="coin">10</span>');$('money').classList.add('hidden');$('order').innerHTML=wanted.map(i=>art[i]).join('');phase='eat';say('いただきます！');hints()};$('customer').onclick=()=>{if(phase!=='eat')return;let item=$('order').firstElementChild;if(item){fly(item,$('customer'),item.outerHTML);item.remove();beep(250);say('もぐもぐ！')}if(!$('order').children.length){phase='done';say('おいしい！ ごちそうさま！');setTimeout(()=>{$('customer').classList.add('depart');setTimeout(()=>{round++;next()},850)},1400)}hints()};$('start').onclick=()=>{$('start').classList.add('hidden');beep();next()};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';if(muted)window.speechSynthesis?.cancel()};</script></html>
